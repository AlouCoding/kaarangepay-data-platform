[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kaarangepay-analytics"
version = "0.1.0"
description = "KaaranguePay analytics: silver Delta -> DuckDB -> dbt star schema -> Streamlit app (business view + fraud console)."
requires-python = ">=3.11"
dependencies = [
    "deltalake==1.7.0",
    "duckdb==2.0.1",
    "dbt-core==1.12.7",
    "dbt-duckdb==1.11.1",
    "streamlit==1.67.0",
    "altair==6.3.0",
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas-stubs"]

[project.scripts]
analytics = "kaarangepay_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["kaarangepay_analytics", "lakehouse", "views"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
module = ["deltalake", "deltalake.*", "duckdb", "dbt", "dbt.*", "streamlit", "streamlit.*", "altair", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
