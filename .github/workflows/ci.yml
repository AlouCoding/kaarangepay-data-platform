name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  payment-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers uses the Docker daemon available on GitHub-hosted runners.
      - name: Build and test
        run: mvn -B verify

  traffic-generator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traffic-generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q

  bronze-writer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bronze-writer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q

  lakehouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lakehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4   # PySpark starts a local JVM for the tests
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q

  analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests app
      - run: mypy
      - run: pytest -q   # real Delta tables + real dbt build + Streamlit AppTest

  docker-images:
    runs-on: ubuntu-latest
    needs: [payment-core, traffic-generator, bronze-writer, lakehouse, analytics]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile traffic --profile cdc --profile bronze --profile lake --profile analytics build
