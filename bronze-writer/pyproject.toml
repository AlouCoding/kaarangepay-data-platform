[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bronze-writer"
version = "0.1.0"
description = "Lands raw Debezium CDC events from Kafka into the bronze layer (Parquet on S3), exactly once per offset."
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.4,<3",
    "pyarrow>=16",
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "boto3-stubs[s3]>=1.34", "pyarrow-stubs>=10"]

[project.scripts]
bronze-writer = "bronze_writer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true
