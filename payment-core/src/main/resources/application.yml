server:
  port: 8080

spring:
  application:
    name: payment-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mmplatform}
    username: ${DB_USER:mmplatform}
    password: ${DB_PASSWORD:mmplatform}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: payment-core

platform:
  system-accounts:
    treasury-id: 00000000-0000-0000-0000-000000000001
    fees-id: 00000000-0000-0000-0000-000000000002
  fees:
    # Fictional fee schedule, in basis points (100 bps = 1 %).
    transfer-bps: 100
    cash-out-bps: 50
    max-fee: 5000
  simulation:
    # DEV / DEMO ONLY — see docs/adr/0004. Never enable in production.
    allow-client-clock: ${ALLOW_CLIENT_CLOCK:false}
