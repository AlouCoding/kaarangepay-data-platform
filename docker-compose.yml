name: mobile-money-data-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mmplatform
      POSTGRES_USER: ${DB_USER:-mmplatform}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mmplatform}
    # wal_level=logical: ready for Debezium CDC in phase 2.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  payment-core:
    build: ./payment-core
    restart: on-failure       # retries if the database is not reachable yet
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mmplatform
      DB_USER: ${DB_USER:-mmplatform}
      DB_PASSWORD: ${DB_PASSWORD:-mmplatform}
      ALLOW_CLIENT_CLOCK: ${ALLOW_CLIENT_CLOCK:-true}   # dev only, see docs/adr/0004
    ports:
      - "${APP_PORT:-8080}:8080"   # change APP_PORT if 8080 is taken on your machine
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Started on demand: `make backfill` or `make live`.
  traffic-generator:
    build: ./traffic-generator
    profiles: ["traffic"]
    command: ["--base-url", "http://payment-core:8080", "live", "--duration-min", "0"]
    volumes:
      - ./data:/app/data
    depends_on:
      payment-core:
        condition: service_healthy

volumes:
  pgdata:
