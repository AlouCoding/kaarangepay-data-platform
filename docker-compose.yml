name: mobile-money-data-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mmplatform
      POSTGRES_USER: ${DB_USER:-mmplatform}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mmplatform}
    # wal_level=logical: required by Debezium CDC (phase 2a, docs/adr/0006).
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  payment-core:
    build: ./payment-core
    restart: on-failure       # retries if the database is not reachable yet
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mmplatform
      DB_USER: ${DB_USER:-mmplatform}
      DB_PASSWORD: ${DB_PASSWORD:-mmplatform}
      ALLOW_CLIENT_CLOCK: ${ALLOW_CLIENT_CLOCK:-true}   # dev only, see docs/adr/0004
    ports:
      - "${APP_PORT:-8080}:8080"   # change APP_PORT if 8080 is taken on your machine
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Started on demand: `make backfill` or `make live`.
  traffic-generator:
    build: ./traffic-generator
    profiles: ["traffic"]
    command: ["--base-url", "http://payment-core:8080", "live", "--duration-min", "0"]
    volumes:
      - ./data:/app/data
    depends_on:
      payment-core:
        condition: service_healthy

  # ===========================================================================
  # Phase 2a — Change Data Capture: PostgreSQL -> Debezium -> Kafka
  # Started on demand:  docker compose --profile cdc up -d
  # See docs/adr/0006 and docs/GUIDE-PHASE2-FR.md
  # ===========================================================================

  # Single-node Kafka in KRaft mode (no ZooKeeper): broker and controller in one process.
  kafka:
    image: apache/kafka:3.9.1
    profiles: ["cdc"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT: for other containers ; EXTERNAL: for tools on your PC (localhost:9094)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # One broker => replication factor 1 everywhere (fine for a laptop, never for production).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9094:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  # Kafka Connect runtime with the Debezium connectors pre-installed.
  connect:
    image: quay.io/debezium/connect:3.0
    profiles: ["cdc"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: kaarangepay-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: "-Xms256m -Xmx768m"
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot job: registers (or updates) the Debezium connector, then exits.
  # PUT /connectors/{name}/config is idempotent: safe to run again.
  connect-init:
    image: curlimages/curl:8.11.1
    profiles: ["cdc"]
    volumes:
      - ./cdc/connectors:/connectors:ro
    command: >
      -fsS -X PUT -H "Content-Type: application/json"
      --data @/connectors/kaarangepay-postgres.json
      http://connect:8083/connectors/kaarangepay-postgres/config
    depends_on:
      connect:
        condition: service_healthy

  # Web UI to browse topics, messages and connector status: http://localhost:8090
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    profiles: ["cdc"]
    environment:
      KAFKA_CLUSTERS_0_NAME: kaarangepay
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      SERVER_PORT: 8080
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # ===========================================================================
  # Phase 2b — Bronze layer: raw CDC events -> Parquet files on S3-compatible storage
  # Started with:  docker compose --profile cdc --profile bronze up -d
  # See docs/adr/0007 and docs/GUIDE-PHASE2-FR.md (part 2b)
  # ===========================================================================

  # S3-compatible object storage (MinIO stopped publishing free images in Oct. 2025).
  # S3 API on :8333, file browser on http://localhost:8888
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    profiles: ["bronze"]
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    ports:
      - "8333:8333"
      - "8888:8888"
    volumes:
      - seaweeddata:/data

  # Our own Kafka consumer: batches per partition, writes Parquet, commits only after the write.
  bronze-writer:
    build: ./bronze-writer
    profiles: ["bronze"]
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      GROUP_ID: bronze-writer
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: bronze
      BATCH_MAX_RECORDS: 5000
      BATCH_MAX_SECONDS: 30
    depends_on:
      kafka:
        condition: service_healthy
      seaweedfs:
        condition: service_started

  # ===========================================================================
  # Phase 3 — lakehouse jobs (Spark): one image, several commands
  #   docker compose run --rm lake silver        3a: bronze -> silver Delta + quality checks
  #   docker compose run --rm lake fraud         3b: Kafka -> fraud alerts (topic + gold Delta)
  #   docker compose run --rm lake fraud-eval    3b: precision / recall against the labels
  # Profiles needed:  set COMPOSE_PROFILES=cdc,bronze,lake
  # Spark UI: add --service-ports to `run` and open http://localhost:4040
  # See docs/adr/0008 and docs/GUIDE-PHASE3-FR.md
  # ===========================================================================
  lake:
    build: ./lakehouse
    profiles: ["lake"]
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      BRONZE_PATH: s3a://bronze
      SILVER_PATH: s3a://silver
      LAKE_FORMAT: delta
      GOLD_PATH: s3a://gold
      KAFKA_BOOTSTRAP: kafka:9092
      LABELS_PATH: file:///data/labels/fraud_labels.jsonl
    volumes:
      - ./data:/data:ro   # fraud labels written by the traffic generator (ground truth)
    ports:
      - "4040:4040"   # Spark UI while a job runs
    depends_on:
      seaweedfs:
        condition: service_started
      kafka:
        condition: service_healthy

  # ===========================================================================
  # Phase 4 — analytics: silver Delta -> DuckDB -> dbt star schema -> Streamlit app
  #   docker compose run --rm analytics pipeline   load + dbt build (models + tests) + publish
  #   docker compose up -d dashboard               http://localhost:8501 (Vue métier + Console fraude)
  # Profiles needed:  set COMPOSE_PROFILES=cdc,bronze,lake,analytics
  # See docs/adr/0010 and docs/GUIDE-PHASE4-FR.md
  # ===========================================================================
  analytics:
    build: ./analytics
    profiles: ["analytics"]
    environment: &analytics-env
      SILVER_URI: s3://silver
      GOLD_URI: s3://gold
      S3_ENDPOINT: http://seaweedfs:8333
    volumes:
      - warehouse:/warehouse
    depends_on:
      seaweedfs:
        condition: service_started

  dashboard:
    build: ./analytics
    profiles: ["analytics"]
    entrypoint: ["streamlit", "run", "app/Home.py", "--server.address=0.0.0.0"]
    command: []
    environment: *analytics-env
    ports:
      - "8501:8501"
    volumes:
      - warehouse:/warehouse
    depends_on:
      seaweedfs:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
  seaweeddata:
  warehouse:
